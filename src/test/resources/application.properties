cms.hostname=cmshostname

# Solr is opt-in in the extension. These tests use two cores from Solr Dev Services.
quarkus.solr.enabled=true
quarkus.solr.devservices.cores.repositem.config-path=se/repos/indexing/solr/repositem
quarkus.solr.devservices.cores.reposxml.config-path=se/simonsoft/cms/indexing/xml/solr/reposxml

# Solr multi-core owns the named repositem client in Quarkus integration tests.
quarkus.arc.exclude-types=se.repos.indexing.config.RepositemSolrClientProducer
